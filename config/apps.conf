# App choices for keybindings. Override in config/apps.local.conf
# (gitignored) — same KEY=Value lines — then re-run install.sh.
TERMINAL=Ghostty
BROWSER=Safari
MUSIC=Spotify
MESSENGER=Slack
# The system monitor the bar's activity pill opens in $TERMINAL. A bare
# command name — the bar resolves it on PATH, since `login` (how the
# terminal runs it) does not. btop, htop, macmon, btm all work.
ACTIVITY=btop
